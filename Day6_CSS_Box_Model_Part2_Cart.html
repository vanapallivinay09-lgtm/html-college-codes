<!DOCTYPE html>
<html>
<head>
<style>
  body {
    font-family: Arial;
    background-color: #f0f0f0;
  }

  /* 1. Background Container */
  .bg-container {
    background-image: url('https://picsum.photos/600/300');
    background-size: cover;
    height: 250px;
    padding: 40px;
    text-align: center;
    color: white;
  }

  /* 2. Styling a Card */
  .card {
    background-color: white;
    width: 300px;
    padding: 20px;          /* Adding Spaces inside */
    border-radius: 12px;    /* rounded corners */
    border: 2px solid #ddd;
    margin: 30px auto;      /* center the card */
    text-align: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }

  /* 3. Styling a Button + Spaces */
  .btn {
    background-color: blue;
    color: white;
    padding: 10px 20px;     /* top-bottom left-right */
    border: none;
    border-radius: 8px;
    margin-top: 15px;       /* space above button */
    font-size: 16px;
  }
</style>
</head>
<body>

<div class="bg-container">
  <h1>Welcome to My Website</h1>
</div>

<div class="card">
  <h3>My Card</h3>
  <p>This is styled using Box Model — padding, border, margin</p>
  <button class="btn">Click Me</button>
</div>

</body>
</html>
