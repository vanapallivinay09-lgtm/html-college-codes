<!DOCTYPE html>
<html>
<head>
<title>CSS Part 2</title>
<style>
  h1 {
    color: blue;
    text-align: center;
  }

  .text-red {
    color: red;
    text-align: center;
  }

  .bg-yellow {
    background-color: lightyellow;
    padding: 20px;
    text-align: center;
  }

  .bg-blue-box {
    background-color: lightblue;
    color: darkblue;
    padding: 15px;
    text-align: center;
  }
</style>
</head>
<body>

<h1>My First CSS Website - Part 2</h1>

<p class="text-red">This text is RED using color property</p>

<div class="bg-yellow">
  <p>This div has YELLOW background</p>
  <p>using background-color property</p>
</div>

<br>

<div class="bg-blue-box">
  <p>Blue background + Dark blue text</p>
  <button style="background-color: blue; color: white; padding: 8px;">Click Me</button>
</div>

</body>
</html>
