<!DOCTYPE html>
<html>
<head>
  <title>CSS Part 1</title>
  <style>
    /* Selector = h1, Property = text-align, Value = center */
    h1 {
      text-align: center;
      color: blue;
    }

    /* Class selector starts with dot */
    .my-box {
      background-color: lightyellow;
      text-align: center;
      padding: 20px;
    }

    .my-button {
      background-color: blue;
      color: white;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h1>My First CSS Website</h1>

  <div class="my-box">
    <p>This is inside a container div</p>
    <p>This text is h-centered</p>
    <button class="my-button">Click Me</button>
  </div>

</body>
</html>
