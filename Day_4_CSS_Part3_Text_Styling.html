<!DOCTYPE html>
<html>
<head>
<style>
  h1 {
    color: blue;
    text-align: center;
    font-size: 32px;
    font-family: Arial;
    text-decoration: underline;
  }
 .big-bold {
    font-size: 24px;
    font-weight: bold;
  }
 .italic-text {
    font-style: italic;
    color: green;
  }
 .underline-box {
    background-color: lightyellow;
    text-decoration: underline;
    font-family: Verdana;
    padding: 15px;
    text-align: center;
  }
</style>
</head>
<body>
<h1>My Styled Website - Part 3</h1>
<p class="big-bold">This is BOLD and BIG - font-weight + font-size</p>
<p class="italic-text">This is Italic Green - font-style</p>
<div class="underline-box">Yellow box + Underline + Verdana font</div>
</body>
</html>
